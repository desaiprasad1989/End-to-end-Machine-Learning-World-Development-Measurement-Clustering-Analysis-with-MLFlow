kmeans:
  n_clusters: [2,3,4,5,6]
  n_init: [10, 20, 50]
  random_state: [42]

hierarchical:
  n_clusters: [2,3,4,5,6]
  linkage: ["ward", "average", "complete"]

dbscan:
  eps: [0.3, 0.5, 0.7]
  min_samples: [3,5,10]

meanshift:
  cluster_all: [true, false]

gmm:
  n_components: [2,3,4,5,6]
  covariance_type: ["full", "tied", "diag", "spherical"]
  random_state: [42]